        .controls {

            padding: 16px;

            border: 1px solid #c9a227;
            border-radius: 4px;
        }
        .controls label { margin-right: 6px; }
        .controls select, .controls input {
            margin: 4px 8px 8px 0;
            padding: 6px;
            background: #111;
            color: #e8e0c8;
            border: 1px solid #555;
        }
        .controls button {
            margin: 6px 6px 0 0;
            padding: 8px 14px;
            background: #3a2a10;
            color: #f0d78c;
            border: 1px solid #c9a227;
            cursor: pointer;
            font-family: inherit;
        }
        .controls button:hover { background: #5a4018; }

        /* ===== FICHA ESTILO OFICIAL ===== */
        .ficha-oficial {
            max-width: 920px;
            margin: 24px auto 40px;
            background: #0d0d0d;
            border: 3px solid #c9a227;
            box-shadow:
                0 0 0 2px #1a1208,
                0 0 0 6px #8b7355,
                0 0 40px rgba(0,0,0,.8);
            padding: 18px 22px 28px;
            color: #e8e0c8;
            position: relative;
        }
        .ficha-oficial::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(201,162,39,.35);
            pointer-events: none;
        }
        .ficha-logo {
            text-align: center;
            font-family: "UnifrakturMaguntia", Georgia, serif;
            font-size: 42px;
            color: #f0e6d0;
            letter-spacing: 2px;
            margin: 8px 0 4px;
            text-shadow: 0 0 12px rgba(201,162,39,.4);
        }
        .ficha-logo span {
            display: block;
            font-size: 18px;
            letter-spacing: 8px;
            font-family: Georgia, serif;
            color: #c9a227;
        }
        .ficha-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px 20px;
            margin: 16px 0 14px;
            font-size: 13px;
        }
        .ficha-header .campo {
            display: grid;
            grid-template-columns: 92px 1fr;
            align-items: baseline;
            gap: 6px;
            border-bottom: 1px solid #555;
            padding-bottom: 3px;
            min-height: 22px;
        }
        .ficha-header .campo label {
            color: #c9a227;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: right;
        }
        .ficha-header .campo span {
            color: #fff;
            font-weight: bold;
            min-width: 0;
        }
        .sec-title {
            text-align: center;
            color: #f0e6d0;
            font-size: 18px;
            letter-spacing: 4px;
            margin: 18px 0 10px;
            text-transform: uppercase;
            border-bottom: 1px solid #c9a227;
            padding-bottom: 4px;
        }
        .cols-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px 16px;
            align-items: start;
        }
        .col-title {
            text-align: center;
            color: #c9a227;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .attr-row {
            display: grid;
            grid-template-columns: 108px 1fr 20px 20px;
            align-items: center;
            column-gap: 6px;
            margin: 2px 0;
            min-height: 20px;
            font-size: 12px;
        }
        .attr-name {
            width: auto;
            text-align: right;
            color: #d4c4a8;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: .3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 2px;
        }
        .dots {
            display: grid;
            grid-template-columns: repeat(10, 12px);
            gap: 2px;
            justify-content: start;
            width: 138px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid #888;
            background: transparent;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform .1s, background .15s, box-shadow .15s;
            display: block;
            margin: 0;
            flex-shrink: 0;
        }
        .dot:hover {
            transform: scale(1.25);
            border-color: #f0c75e;
            box-shadow: 0 0 6px rgba(240,199,94,.7);
            z-index: 1;
        }
        .dot.filled {
            background: #f0c75e;
            border-color: #c9a227;
            box-shadow: 0 0 4px rgba(240,199,94,.5);
        }
        .mod-box {
            width: 18px;
            height: 18px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
            transition: transform .1s;
            justify-self: center;
        }
        .mod-box:hover { transform: scale(1.15); }
        .mod-blue {
            background: #1a4a8a;
            border: 1px solid #3a7ad0;
            color: #a0d0ff;
        }
        .mod-red {
            background: #8a1a1a;
            border: 1px solid #d03a3a;
            color: #ffb0b0;
        }
        .mod-empty {
            background: transparent;
            border: 1px solid #444;
            color: #666;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
            align-items: stretch;
        }
        .box-panel {
            border: 1px solid #555;
            padding: 10px 12px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
        }
        .box-panel .attr-row {
            grid-template-columns: 100px 1fr 20px 20px;
        }
        .box-panel h4 {
            margin: 0 0 8px;
            color: #c9a227;
            font-size: 12px;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }
        .prof-stars {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 6px 0;
        }
        .star {
            width: 18px;
            height: 18px;
            background: #222;
            border: 1px solid #666;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .star.on {
            background: #f0c75e;
            border-color: #c9a227;
        }
        .sq-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .sq {
            width: 14px;
            height: 14px;
            border: 1px solid #666;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform .1s, background .15s;
            display: inline-block;
        }
        .sq:hover { transform: scale(1.25); border-color: #f0c75e; }
        .sq.blue { background: #1a4a8a; border-color: #3a7ad0; }
        .sq.red { background: #8a1a1a; border-color: #d03a3a; }
        .sq.yellow { background: #f0c75e; border-color: #c9a227; }
        .sq.purple { background: #5a2a8a; border-color: #9a5ad0; }
        .sq.filled-will { background: #c41e1e; border-color: #ff4444; border-radius: 50%; }
        .star {
            cursor: pointer;
            transition: transform .1s;
        }
        .star:hover { transform: scale(1.3); }
        .campo span[contenteditable] {
            outline: none;
            min-width: 40px;
            cursor: text;
            border-bottom: 1px dashed transparent;
        }
        .campo span[contenteditable]:hover,
        .campo span[contenteditable]:focus {
            border-bottom-color: #c9a227;
            color: #fff;
        }
        .passiva-box[contenteditable],
        .vm-value[contenteditable] {
            outline: none;
            cursor: text;
        }
        .passiva-box[contenteditable]:focus,
        .vm-value[contenteditable]:focus {
            border-color: #c9a227;
            color: #fff;
        }
        .vm-value { cursor: text; }
        .vital-mana {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
            align-items: stretch;
        }
        .vm-label {
            color: #c9a227;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-align: center;
        }
        .vm-value {
            font-size: 22px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }
        .passiva-box {
            border: 1px solid #555;
            min-height: 40px;
            margin-top: 8px;
            padding: 6px;
            font-size: 12px;
            color: #aaa;
            flex: 1;
        }
        .sq-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: nowrap;
            margin: 4px 0;
        }
        @media (max-width: 900px) {
            .cols-3 {
                grid-template-columns: 1fr;
                max-width: 420px;
                margin: 0 auto;
            }
            .ficha-header, .bottom-grid, .vital-mana {
                grid-template-columns: 1fr;
            }
            .attr-row {
                grid-template-columns: 120px 1fr 20px 20px;
            }
            .dots {
                width: auto;
                grid-template-columns: repeat(10, 13px);
            }
        }
    </style>

<script>
        function gerarPDF() {
            const ficha = document.querySelector(".ficha-oficial") || document.getElementById("ficha");

            html2pdf()
                .set({
                    margin: 8,
                    filename: 'ficha-hurras.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, backgroundColor: '#0d0d0d' },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                })
                .from(ficha)
                .save();
        }
    </script>

        function parseValor(value) {
            if (value === true || value === false || value == null) return 0;
            if (typeof value === "number") return value;
            const m = String(value).match(/([+-]?\d+)/);
            return m ? parseInt(m[1], 10) : 0;
        }

        function buscarEmObj(obj, chaves) {
            if (!obj) return 0;
            for (const k of chaves) {
                if (obj[k] !== undefined) return parseValor(obj[k]);
            }
            return 0;
        }

        function getAtributoDetalhado(nomeAtributo) {
            const racaKey = document.getElementById("raca").value;
            const classeKey = document.getElementById("classe").value;
            const subRaw = document.getElementById("subclasse").value;
            const subKey = mapaSubclasse[subRaw] || subRaw;

            const raca = racas[racaKey] || {};
            const classe = classes[classeKey] || {};
            const sub = (classe.variacoes && classe.variacoes[subKey]) || {};

            const chaves = mapaAtributos[nomeAtributo] || [nomeAtributo];

            let bonus = 0;
            let fraqueza = 0;

            bonus += buscarEmObj(raca.bonus, chaves);
            bonus += buscarEmObj(classe.statusInicial && classe.statusInicial.bonus, chaves);
            bonus += buscarEmObj(sub.bonus, chaves);

            fraqueza += Math.abs(buscarEmObj(raca.fraqueza, chaves));
            fraqueza += Math.abs(buscarEmObj(classe.statusInicial && classe.statusInicial.fraqueza, chaves));
            fraqueza += Math.abs(buscarEmObj(sub.fraqueza, chaves));

            return {
                bonus: bonus,
                fraqueza: fraqueza,
                total: bonus - fraqueza
            };
        }

        function getBonusText(atributo) {
            const d = getAtributoDetalhado(atributo);
            return d.total >= 0 ? `+${d.total}` : `${d.total}`;
        }

        /* Estado persistente da ficha (bolinhas clicáveis) */
        const fichaState = {};

        function randomValue(level) {
            const max = parseInt(level) || 1;
            return Math.floor(Math.random() * (max + 1));
        }

        function getAttrValue(nome) {
            if (fichaState[nome] === undefined) {
                const base = randomValue(document.getElementById("nivel").value);
                const d = getAtributoDetalhado(nome);
                fichaState[nome] = Math.max(0, Math.min(10, base + d.total));
            }
            return fichaState[nome];
        }

        function setAttrValue(nome, val) {
            fichaState[nome] = Math.max(0, Math.min(10, val));
            atualizarLinhaAttr(nome);
        }

        function clickDot(nome, index) {
            const atual = getAttrValue(nome);
            // Clica na bolinha N: se já está nesse valor, desce 1; senão preenche até N
            if (atual === index + 1) {
                setAttrValue(nome, index);
            } else {
                setAttrValue(nome, index + 1);
            }
        }

        function clickMod(nome, tipo) {
            const d = getAtributoDetalhado(nome);
            let v = getAttrValue(nome);
            if (tipo === 'plus') {
                setAttrValue(nome, v + 1);
            } else if (tipo === 'minus') {
                setAttrValue(nome, v - 1);
            }
        }

        function renderDots(nome, filled, maxDots) {
            maxDots = maxDots || 10;
            filled = Math.max(0, Math.min(filled, maxDots));
            const safe = nome.replace(/'/g, "\\'");
            let html = `<div class="dots" data-attr="${nome}">`;
            for (let i = 0; i < maxDots; i++) {
                html += `<span class="dot${i < filled ? ' filled' : ''}" title="${i + 1}" onclick="clickDot('${safe}', ${i})"></span>`;
            }
            html += '</div>';
            return html;
        }

        function renderAttr(nomeAtributo, maxDots) {
            maxDots = maxDots || 10;
            const d = getAtributoDetalhado(nomeAtributo);
            const total = getAttrValue(nomeAtributo);
            const safe = nomeAtributo.replace(/'/g, "\\'");

            const blue = d.bonus > 0
                ? `<span class="mod-box mod-blue" title="Bônus +${d.bonus} (clique para +1)" onclick="clickMod('${safe}','plus')">+${d.bonus}</span>`
                : `<span class="mod-box mod-empty" title="+1" onclick="clickMod('${safe}','plus')">+</span>`;
            const red = d.fraqueza > 0
                ? `<span class="mod-box mod-red" title="Fraqueza −${d.fraqueza} (clique para −1)" onclick="clickMod('${safe}','minus')">−${d.fraqueza}</span>`
                : `<span class="mod-box mod-empty" title="−1" onclick="clickMod('${safe}','minus')">−</span>`;

            return `
            <div class="attr-row" data-attr-row="${nomeAtributo}">
                <span class="attr-name">${nomeAtributo}:</span>
                ${renderDots(nomeAtributo, total, maxDots)}
                ${blue}${red}
            </div>`;
        }

        function atualizarLinhaAttr(nome) {
            const row = document.querySelector(`[data-attr-row="${CSS.escape(nome)}"]`);
            if (!row) return;
            const filled = getAttrValue(nome);
            const dots = row.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i < filled) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        /* ===== Tracks genéricos (vontade, mana, vital, prof, benção) ===== */
        function getTrack(key, defVal) {
            if (fichaState[key] === undefined) fichaState[key] = defVal;
            return fichaState[key];
        }

        function setTrack(key, val, max) {
            fichaState[key] = Math.max(0, Math.min(max || 10, val));
            atualizarTrack(key);
        }

        function clickTrack(key, index, max, fillClass) {
            const atual = getTrack(key, 0);
            if (atual === index + 1) setTrack(key, index, max);
            else setTrack(key, index + 1, max);
        }

        function renderTrack(key, filled, max, fillClass) {
            max = max || 10;
            filled = Math.max(0, Math.min(filled, max));
            fichaState[key] = filled;
            let html = `<div class="sq-row" data-track="${key}">`;
            for (let i = 0; i < max; i++) {
                const on = i < filled ? ` ${fillClass}` : '';
                html += `<span class="sq${on}" onclick="clickTrack('${key}',${i},${max},'${fillClass}')"></span>`;
            }
            html += '</div>';
            return html;
        }

        function atualizarTrack(key) {
            const row = document.querySelector(`[data-track="${key}"]`);
            if (!row) return;
            const filled = getTrack(key, 0);
            const fillClass = row.dataset.fill || '';
            // detect fill class from first filled or data attr
            const classes = ['filled-will', 'blue', 'red', 'purple', 'yellow'];
            row.querySelectorAll('.sq').forEach((sq, i) => {
                classes.forEach(c => sq.classList.remove(c));
                if (i < filled) {
                    // re-apply from original pattern stored in data-fill
                    const fc = row.getAttribute('data-fill') || 'blue';
                    sq.classList.add(fc);
                }
            });
            // update number displays if any
            const num = document.querySelector(`[data-track-num="${key}"]`);
            if (num) {
                if (key === 'vitalidade') num.textContent = filled * 10 || filled;
                else if (key === 'mana') num.textContent = filled * 5 || filled;
                else num.textContent = filled;
            }
        }

        function renderStars(key, filled, max) {
            max = max || 5;
            filled = Math.max(0, Math.min(filled, max));
            fichaState[key] = filled;
            let html = `<div class="prof-stars" data-track="${key}" data-fill="on">`;
            for (let i = 0; i < max; i++) {
                html += `<span class="star${i < filled ? ' on' : ''}" onclick="clickStar('${key}',${i},${max})"></span>`;
            }
            html += '</div>';
            return html;
        }

        function clickStar(key, index, max) {
            const atual = getTrack(key, 0);
            if (atual === index + 1) setTrack(key, index, max);
            else setTrack(key, index + 1, max);
            const row = document.querySelector(`[data-track="${key}"]`);
            if (!row) return;
            const filled = getTrack(key, 0);
            row.querySelectorAll('.star').forEach((s, i) => {
                if (i < filled) s.classList.add('on');
                else s.classList.remove('on');
            });
        }

        // override setTrack visual for sq tracks with data-fill
        const _setTrack = setTrack;
        setTrack = function(key, val, max) {
            fichaState[key] = Math.max(0, Math.min(max || 20, val));
            const row = document.querySelector(`[data-track="${key}"]`);
            if (!row) return;
            const filled = fichaState[key];
            if (row.classList.contains('prof-stars')) {
                row.querySelectorAll('.star').forEach((s, i) => {
                    if (i < filled) s.classList.add('on'); else s.classList.remove('on');
                });
                return;
            }
            const fc = row.getAttribute('data-fill') || 'blue';
            row.querySelectorAll('.sq').forEach((sq, i) => {
                ['filled-will','blue','red','purple','yellow'].forEach(c => sq.classList.remove(c));
                if (i < filled) sq.classList.add(fc);
            });
            const num = document.querySelector(`[data-track-num="${key}"]`);
            if (num) {
                if (key === 'vitalidade') num.textContent = String(fichaState.vitalNum ?? filled);
                else if (key === 'mana') num.textContent = String(fichaState.manaNum ?? filled);
                else num.textContent = filled;
            }
        };

        function renderTrackFill(key, filled, max, fillClass) {
            max = max || 10;
            filled = Math.max(0, Math.min(Number(filled) || 0, max));
            fichaState[key] = filled;
            let html = `<div class="sq-row" data-track="${key}" data-fill="${fillClass}" style="justify-content:flex-start;">`;
            for (let i = 0; i < max; i++) {
                const on = i < filled ? ` ${fillClass}` : '';
                html += `<span class="sq${on}" onclick="clickTrack('${key}',${i},${max})"></span>`;
            }
            html += '</div>';
            return html;
        }

        const profissoesDesc = {
            Alquimista: "Especialista na transformação e combinação de materiais. Produz poções, elixires e compostos.",
            Armeiro: "Especializado na criação e manutenção de armas e armaduras.",
            Artífice: "Criação de itens mágicos e artefatos com técnicas de fabricação e runas.",
            Encantador: "Aplica magia a equipamentos e objetos, concedendo novas propriedades.",
            Engenheiro: "Criação, manutenção e reparo de mecanismos complexos.",
            Médico: "Tratamento de doenças e ferimentos com conhecimentos médicos e Mana."
        };

        function onClasseChange() {
            const classeKey = document.getElementById("classe").value;
            const sub = document.getElementById("subclasse");
            // mostra só subclasses da classe escolhida
            for (let i = 0; i < sub.options.length; i++) {
                const opt = sub.options[i];
                if (!opt.value) { opt.hidden = false; continue; }
                const group = opt.parentElement;
                const match = group.tagName === "OPTGROUP" && group.label === classeKey;
                opt.hidden = !match;
            }
            // se a subclasse atual não pertence à classe, limpa
            const cur = sub.options[sub.selectedIndex];
            if (cur && cur.value && cur.hidden) sub.selectedIndex = 0;
            criarFicha();
        }

        function atualizarCabecalho() {
            const el = document.querySelector('.ficha-header .campo span');
            if (!el) return;
            const nome = document.getElementById("nome").value.trim() || "Alma Perdida";
            // atualiza só o campo Nome sem reroll
            const campos = document.querySelectorAll('.ficha-header .campo');
            campos.forEach(c => {
                const lab = c.querySelector('label');
                if (lab && lab.textContent.includes('Nome')) {
                    const sp = c.querySelector('span');
                    if (sp) sp.textContent = nome;
                }
            });
        }

        function criarFicha(manterValores) {
            if (!manterValores) {
                for (const k of Object.keys(fichaState)) delete fichaState[k];
            }

            const nome = document.getElementById("nome").value.trim() || "Alma Perdida";
            const nivel = Number(document.getElementById("nivel").value) || 1;

            const racaKey = document.getElementById("raca").value;
            const classeKey = document.getElementById("classe").value;
            const subclasseKey = document.getElementById("subclasse").value;
            const natureza = document.getElementById("natureza").value || "—";
            const profissao = document.getElementById("profissao").value || "—";
            const profDesc = profissoesDesc[profissao] || "";

            const raca = racas[racaKey] || { nome: racaKey, bonus: {} };
            const classe = classes[classeKey] || { nome: classeKey, statusInicial: {}, variacoes: {} };

            const subLabel = (() => {
                const sel = document.getElementById("subclasse");
                const opt = sel.options[sel.selectedIndex];
                return opt && opt.value ? opt.text : "—";
            })();

            const willDef = Math.min(nivel, 10);
            const starsDef = Math.min(Math.ceil(nivel / 2), 5);
            const profDef = Math.min(nivel, 5);
            const vitalNum = nivel * 10;
            const manaNum = nivel * 5;
            fichaState.vitalNum = vitalNum;
            fichaState.manaNum = manaNum;

            document.getElementById("ficha").innerHTML = `
<div class="ficha-oficial">
    <div class="ficha-logo">Hurras<span>FANTASY</span></div>

    <div class="ficha-header">
        <div class="campo"><label>Nome:</label><span contenteditable="true">${nome}</span></div>
        <div class="campo"><label>Natureza:</label><span contenteditable="true">${natureza}</span></div>
        <div class="campo"><label>Crença:</label><span contenteditable="true">—</span></div>
        <div class="campo"><label>Player:</label><span contenteditable="true">—</span></div>
        <div class="campo"><label>Comportamento:</label><span contenteditable="true">—</span></div>
        <div class="campo"><label>Raça:</label><span contenteditable="true">${raca.nome}</span></div>
        <div class="campo"><label>Crônica:</label><span contenteditable="true">—</span></div>
        <div class="campo"><label>Profissão:</label><span contenteditable="true">${profissao}</span></div>
        <div class="campo"><label>Classe:</label><span contenteditable="true">${classe.nome}${subLabel !== "—" ? " / " + subLabel : ""}</span></div>
    </div>

    <div class="sec-title">Atributos</div>
    <div class="cols-3">
        <div>
            <div class="col-title">Físicos</div>
            ${renderAttr("Força")}
            ${renderAttr("Destreza")}
            ${renderAttr("Vigor")}
        </div>
        <div>
            <div class="col-title">Social</div>
            ${renderAttr("Carisma")}
            ${renderAttr("Manipulação")}
            ${renderAttr("Persuasão")}
        </div>
        <div>
            <div class="col-title">Mental</div>
            ${renderAttr("Percepção")}
            ${renderAttr("Inteligência")}
            ${renderAttr("Reação")}
        </div>
    </div>

    <div class="sec-title">Habilidades</div>
    <div class="cols-3">
        <div>
            <div class="col-title">Talentos</div>
            ${renderAttr("Intimidação")}
            ${renderAttr("Liderança")}
            ${renderAttr("Manha")}
            ${renderAttr("Lábia")}
            ${renderAttr("Esquiva")}
            ${renderAttr("Briga")}
            ${renderAttr("Investida")}
            ${renderAttr("Crítico")}
            ${renderAttr("Bloqueio")}
            ${renderAttr("Avaliação")}
        </div>
        <div>
            <div class="col-title">Perícias</div>
            ${renderAttr("Adestramento")}
            ${renderAttr("Ofício")}
            ${renderAttr("Cavalgada")}
            ${renderAttr("Arma Mágica")}
            ${renderAttr("Arma Distância")}
            ${renderAttr("Arma 1 Mão")}
            ${renderAttr("Arma 2 Mãos")}
            ${renderAttr("Segurança")}
            ${renderAttr("Furtividade")}
            ${renderAttr("Armadura")}
        </div>
        <div>
            <div class="col-title">Conhecimentos</div>
            ${renderAttr("Acadêmicos")}
            ${renderAttr("Finanças")}
            ${renderAttr("Encantamento")}
            ${renderAttr("Runas")}
            ${renderAttr("Medicina")}
            ${renderAttr("Ciências")}
            ${renderAttr("Tecnologia")}
            ${renderAttr("Linguística")}
            ${renderAttr("Investigação")}
            ${renderAttr("Ocultação")}
        </div>
    </div>

    <div class="sec-title">Vantagens</div>
    <div class="bottom-grid">
        <div class="box-panel">
            <h4>Virtudes</h4>
            ${renderAttr("Consciência")}
            ${renderAttr("Autocontrole")}
            ${renderAttr("Coragem")}
        </div>
        <div class="box-panel">
            <h4>Proficiência</h4>
            ${renderStars('profStars', starsDef, 5)}
            ${renderTrackFill('profBlue', profDef, 5, 'blue')}
            <p style="text-align:center;font-size:12px;margin:8px 0 0;color:#aaa;">Nível ${nivel}</p>
        </div>
        <div class="box-panel">
            <h4>Força de Vontade</h4>
            ${renderTrackFill('vontade', willDef, 10, 'filled-will')}
            ${renderTrackFill('vontadeTemp', 0, 10, 'yellow')}
        </div>
    </div>

    <div class="vital-mana">
        <div class="box-panel">
            <div class="vm-label">Vitalidade</div>
            <div class="vm-value" contenteditable="true" data-track-num="vitalidade">${vitalNum}</div>
            ${renderTrackFill('vitalTrack', Math.min(nivel, 10), 10, 'red')}
        </div>
        <div class="box-panel">
            <div class="vm-label">Mana</div>
            <div class="vm-value" contenteditable="true" data-track-num="mana">${manaNum}</div>
            ${renderTrackFill('manaTrack', Math.min(nivel, 10), 10, 'blue')}
        </div>
    </div>

    <div class="bottom-grid" style="margin-top:14px;">
        <div class="box-panel">
            <h4>Passiva / Profissão</h4>
            <div class="passiva-box" contenteditable="true">${profDesc || "—"}</div>
        </div>
        <div class="box-panel">
            <h4>Benção / Maldição</h4>
            ${renderTrackFill('bencao', 4, 4, 'purple')}
            ${renderTrackFill('maldicao', 0, 4, 'red')}
        </div>
        <div class="box-panel">
            <h4>Experiência</h4>
            <div class="passiva-box" contenteditable="true" style="text-align:center;">0 XP</div>
        </div>
    </div>

    <div class="sec-title" style="margin-top:18px;">Magias / Técnicas &amp; Resistência</div>
    <div class="cols-3">
        <div>
            <div class="col-title">Elementos</div>
            ${renderAttr("fogo")}
            ${renderAttr("agua")}
            ${renderAttr("terra")}
            ${renderAttr("ar")}
            ${renderAttr("RAIO")}
        </div>
        <div>
            <div class="col-title">Outras</div>
            ${renderAttr("VENENO")}
            ${renderAttr("MENTAL")}
            ${renderAttr("SAGRADA")}
            ${renderAttr("SOMBRIO")}
        </div>
        <div>
            <div class="col-title">Notas</div>
            <p style="font-size:11px;color:#888;line-height:1.5;" contenteditable="true">
                Clique nas bolinhas e quadrados para preencher.<br>
                Clique nos textos para editar.<br>
                <span style="color:#3a7ad0;">■ Azul</span> = bônus ·
                <span style="color:#d03a3a;">■ Vermelho</span> = fraqueza.
            </p>
        </div>
    </div>
</div>
            `;
        }

        function criarAleatorio() {
            const racaOpts = document.getElementById("raca").options;
            const classeOpts = document.getElementById("classe").options;
            const nivelOpts = document.getElementById("nivel").options;
            const natOpts = document.getElementById("natureza").options;
            const profOpts = document.getElementById("profissao").options;

            document.getElementById("raca").selectedIndex = 1 + Math.floor(Math.random() * (racaOpts.length - 1));
            document.getElementById("classe").selectedIndex = Math.floor(Math.random() * classeOpts.length);
            document.getElementById("nivel").selectedIndex = Math.floor(Math.random() * nivelOpts.length);
            document.getElementById("nome").value = "Alma Perdida #" + Math.floor(Math.random() * 999);
            document.getElementById("natureza").selectedIndex = 1 + Math.floor(Math.random() * (natOpts.length - 1));
            document.getElementById("profissao").selectedIndex = 1 + Math.floor(Math.random() * (profOpts.length - 1));

            onClasseChange();
        }

        // inicia filtrando subclasses e gerando ficha
        document.addEventListener("DOMContentLoaded", () => {
            onClasseChange();
        });
    </script>
</body>
</html>
