<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha — Nexalis</title>
  <link rel="stylesheet" href="../site.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#080604dc,#080604dc),url('../classes/css/img/castelo.png') center/cover fixed;color:#e7e2d8;font-family:Arial,sans-serif}.pagina{max-width:1060px;margin:58px auto;padding:30px 38px 46px;background:#100d0be0;border:1px solid #945614;border-radius:10px;box-shadow:0 18px 50px #000b}.voltar{color:#d8a244;text-decoration:none;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}header{text-align:center;margin:24px 0 30px;padding-bottom:18px;border-bottom:1px solid #6d4519}h1{margin:0;color:#ffad18;font-family:Georgia,serif;font-size:2rem;text-transform:uppercase}.sub{color:#d8a244;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}header p:last-child{font-size:.86rem;color:#d7d0c6}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,.9fr);gap:18px;align-items:start}.secao,.cartao{background:#0b0a09c9;border:1px solid #71501d;border-radius:4px;overflow:hidden}.secao h2,.cartao h2{margin:0;padding:8px 11px;color:#e7a52d;background:#1b130b;border-bottom:1px solid #9a641d;font:bold .82rem Georgia,serif;text-transform:uppercase}.secao p{padding:2px 13px;font-size:.88rem;line-height:1.65;color:#ded7cf}.secao+ .secao{margin-top:14px}.painel{display:grid;gap:14px}.cartao{padding-bottom:11px}.cartao p,.cartao ul{margin:10px 13px;font-size:.85rem;line-height:1.55}.cartao ul{padding-left:19px}.cartao li{margin:8px 0;color:#ddd5c7}.moeda{color:#ffb31d;font-weight:bold}.atributos{color:#36efab!important;font-weight:bold}.erro{margin-top:40px}@media(max-width:720px){.pagina{margin:0;padding:24px 16px;border-radius:0}.layout{grid-template-columns:1fr}h1{font-size:1.55rem}}
  </style>
</head>
<body>
  <main class="pagina" id="conteudo"></main>
  <script>
    const fichas={
      animagos:{tipo:'Raça',nome:'Animagos',sub:'Herdeiros de um espírito animal ancestral.',ficha:['Origem: Linhagem bestial','Afinidade: escolha uma fera-guia','Traço: sentidos aguçados'],historia:'Os Animagos surgiram quando clãs humanos selaram pactos com espíritos da floresta. Cada família carrega sinais da sua fera-guia e aprende a ouvir os instintos sem se render a eles.',moeda:'Folhas de Âmbar',passivas:['Instinto da Fera — vantagem narrativa ao rastrear, caçar ou perceber perigo ligado à sua fera-guia.','Pele do Ermo — ignora penalidades leves de clima e terreno natural.','Voz do Bando — animais comuns reagem com menos hostilidade.']},
      homunculo:{tipo:'Raça',nome:'Homúnculo',sub:'Vida artificial movida por alquimia e runas.',ficha:['Origem: laboratório, oficina ou ruína','Corpo: escolhido pelo criador','Traço: núcleo alquímico'],historia:'Criados para servir a mestres arcanos, muitos Homúnculos despertaram além das ordens recebidas. Eles viajam para descobrir se uma alma pode nascer de uma fórmula.',moeda:'Fragmentos de Éter',passivas:['Corpo Preparado — resistência natural a venenos e doenças comuns.','Memória Gravada — recorda com precisão textos, símbolos e rotas já observados.','Núcleo Estável — não precisa dormir; repouso imóvel restaura suas forças.']},
      golens:{tipo:'Raça',nome:'Golens',sub:'Construtos conscientes de pedra, ferro, argila ou cristal.',ficha:['Origem: material de construção','Estrutura: mineral, metálica ou argilosa','Traço: selo de despertar'],historia:'Os primeiros Golens guardavam templos e fortalezas. Quando antigos selos se romperam, alguns passaram a escolher seu próprio caminho e a esculpir um propósito que não lhes foi dado.',moeda:'Marcas de Forja',passivas:['Carapaça Viva — absorve parte de impactos físicos leves.','Passo Inabalável — difícil de empurrar, derrubar ou mover à força.','Corpo Sem Fome — não precisa comer, embora possa fazê-lo por costume.']},
      wendigo:{tipo:'Raça',nome:'Wendigo',sub:'Povo das matas glaciais, ligado ao vento do inverno.',ficha:['Origem: florestas do norte','Afinidade: gelo e sobrevivência','Traço: faro invernal'],historia:'Os Wendigos preservam lendas sobre o frio que pensa e observa. Para eles, sobreviver nunca foi dominar a natureza, mas aprender quando seguir, esconder-se ou compartilhar o fogo.',moeda:'Dentes de Geada',passivas:['Faro do Inverno — rastreia criaturas e rotas em neve ou neblina.','Sangue Frio — resistência a temperaturas extremas.','Caçador Silencioso — passos fazem pouco ruído sobre gelo e mata fechada.']},
      'elfos-do-mar':{tipo:'Raça',nome:'Elfos do Mar',sub:'Navegadores de recifes e cidades submersas.',ficha:['Origem: costa, recife ou abismo','Afinidade: água e correntes','Traço: visão marinha'],historia:'Os Elfos do Mar construíram cidades de coral onde as correntes guardam histórias. Muitos sobem à superfície como diplomatas, cartógrafos ou guardiões de rotas ameaçadas.',moeda:'Pérolas de Maré',passivas:['Respiração Anfíbia — respira ar e água.','Visão das Profundezas — enxerga melhor em baixa luz aquática.','Nado das Correntes — movimenta-se com facilidade em água corrente.']},
      doppelganger:{tipo:'Raça',nome:'Doppelganger',sub:'Metamorfos que colecionam rostos, gestos e vozes.',ficha:['Origem: linhagem mutável','Afinidade: observação e disfarce','Traço: rosto espelho'],historia:'A tradição Doppelganger ensina que toda identidade é uma história. Eles escondem seu rosto original não por vergonha, mas porque acreditam que conhecer muitos papéis revela a verdade de cada pessoa.',moeda:'Fichas de Espelho',passivas:['Olhar Mimético — memoriza detalhes visuais de alguém após observação atenta.','Voz Adaptável — reproduz timbres simples já escutados.','Leitura de Gestos — percebe hesitações e mudanças de comportamento com facilidade.']},
      espectro:{tipo:'Raça',nome:'Espectro',sub:'Almas materializadas por um juramento inacabado.',ficha:['Origem: memória, pacto ou ruína','Afinidade: sombra e lembrança','Traço: âncora espiritual'],historia:'Espectros não são mortos sem vontade. São consciências que recusaram desaparecer até concluir uma promessa. Alguns procuram justiça; outros apenas desejam lembrar o próprio nome.',moeda:'Óbolos Velados',passivas:['Visão Etérea — percebe presenças espirituais e rastros sobrenaturais sutis.','Corpo Brumoso — reduz efeitos de quedas e pequenos obstáculos físicos.','Memória Além do Véu — dificilmente esquece promessas, nomes e locais marcantes.']},
      kitsune:{tipo:'Raça',nome:'Kitsune',sub:'Espíritos-raposa de fogo-fátuo e muitas caudas.',ficha:['Origem: santuário, floresta ou vila antiga','Afinidade: ilusão e chama espiritual','Traço: cauda ancestral'],historia:'Kitsunes guardam histórias, segredos e promessas feitas à luz de lanternas. Quanto mais experientes, mais caudas simbólicas conquistam — cada uma representa uma lição aprendida.',moeda:'Sinós de Jade',passivas:['Fogo-Fátuo — emite uma luz suave, fria e controlada.','Passo de Raposa — desloca-se silenciosamente em ambientes urbanos ou naturais.','Máscara Social — percebe com facilidade regras, títulos e costumes de um grupo.']},
      ilusionista:{tipo:'Classe',nome:'Ilusionista',sub:'Mestre da percepção, do palco e do engano arcano.',ficha:['Função: controle e infiltração','Atributo-chave: Intelecto','Equipamento: foco ilusório'],historia:'Ilusionistas estudam o ponto entre aquilo que existe e aquilo que todos acreditam existir. Os maiores não mentem: oferecem aos outros exatamente a imagem que desejam ver.',moeda:'Coroas de Prisma',passivas:['Olho do Truque — identifica padrões de ilusões e disfarces.','Presença Indefinida — pessoas esquecem detalhes menores sobre sua aparência após encontros breves.','Mente em Camadas — resistência a confusão e manipulação sensorial.']},
      trapaceiro:{tipo:'Classe',nome:'Trapaceiro',sub:'Especialista em improviso, blefe e oportunidades.',ficha:['Função: exploração e precisão','Atributo-chave: Destreza','Equipamento: ferramentas discretas'],historia:'Trapaceiros aprendem em ruas, caravanas e salões nobres que toda porta tem uma fraqueza — uma fechadura, uma regra ou alguém disposto a conversar.',moeda:'Fichas de Latão',passivas:['Mãos Ligeiras — manipula objetos pequenos sem chamar atenção.','Sorte Preparada — encontra recursos simples que planejou guardar.','Olho para Saídas — percebe rotas de fuga e pontos de cobertura rapidamente.']},
      psionicos:{tipo:'Classe',nome:'Psiónicos',sub:'Guerreiros e estudiosos da força mental.',ficha:['Função: controle mental e suporte','Atributo-chave: Vontade','Equipamento: cristal de foco'],historia:'Psiónicos descobrem que a mente não é apenas pensamento: ela é uma maré capaz de tocar matéria, emoção e memória. Suas escolas treinam disciplina antes de poder.',moeda:'Cacos de Noosfera',passivas:['Mente Blindada — resistência a medo, encanto e intrusão mental.','Leitura Emocional — percebe emoções intensas próximas.','Concentração Profunda — mantém foco mesmo sob pressão moderada.']},
      antipaladino:{tipo:'Classe',nome:'Antipaladino / Algoz',sub:'Juramentado a uma justiça implacável e sombria.',ficha:['Função: vanguarda e intimidação','Atributo-chave: Vontade','Equipamento: armadura e símbolo de juramento'],historia:'Algozes surgiram onde a lei falhou. Seu juramento não exige bondade; exige consequência. Alguns perseguem monstros, outros caçam reis, mas todos carregam o peso de suas sentenças.',moeda:'Selos de Penitência',passivas:['Presença de Julgamento — inimigos percebem sua determinação antes do confronto.','Armadura do Voto — acostuma-se rapidamente a equipamentos pesados.','Memória da Dívida — raramente esquece uma promessa quebrada ou ofensa grave.']},
      arcanista:{tipo:'Classe',nome:'Arcanista',sub:'Estudioso da energia mágica em sua forma pura.',ficha:['Função: conhecimento e proteção','Atributo-chave: Intelecto','Equipamento: grimório e catalisador'],historia:'Arcanistas registram leis que o mundo prefere manter ocultas. Em bibliotecas, ruínas e torres, aprendem que todo feitiço é uma conversa com forças antigas.',moeda:'Lumes Arcanos',passivas:['Erudição Rúnica — reconhece símbolos, selos e tradições mágicas.','Reserva Metódica — recupera foco mais rápido durante repouso.','Visão de Fluxo — percebe magia ativa em objetos e locais próximos.']},
      'clerigo-de-guerra':{tipo:'Classe',nome:'Clérigo de Guerra',sub:'Devoto que protege aliados na linha de frente.',ficha:['Função: suporte marcial','Atributo-chave: Fé','Equipamento: símbolo sagrado e arma ritual'],historia:'Clérigos de Guerra acreditam que a fé deve caminhar ao lado de quem precisa dela. Seus templos são fortalezas, hospitais de campanha e refúgios para quem retornou da batalha.',moeda:'Dízimos de Aço',passivas:['Disciplina Marcial — proficiência narrativa com treinamento militar e formação de tropas.','Vigília Sagrada — permanece alerta por longos períodos de guarda.','Presença Protetora — aliados próximos sentem maior confiança diante do medo.']},
      'clerigo-negro':{tipo:'Classe',nome:'Clérigo Negro',sub:'Sacerdote dos limites, dos mortos e dos deuses esquecidos.',ficha:['Função: rituais e proteção profana','Atributo-chave: Fé','Equipamento: relicário funerário'],historia:'Clérigos Negros não cultuam necessariamente o mal. Muitos guardam túmulos, negociam com espíritos e mantêm tradições que outros preferem temer. Seu dever é impedir que o véu se rompa.',moeda:'Óbolos de Ônix',passivas:['Conhecimento Funerário — entende ritos, maldições e símbolos de sepultamento.','Vontade Sepulcral — resistência a medo e influência espiritual hostil.','Guardião do Véu — percebe distúrbios próximos entre vida, morte e sonho.']}
    };
    const pontos={
      animagos:'Força 3 · Destreza 3 · Intelecto 1 · Vontade 2',homunculo:'Força 2 · Destreza 1 · Intelecto 3 · Vontade 3',golens:'Força 4 · Destreza 1 · Intelecto 2 · Vontade 2',wendigo:'Força 3 · Destreza 2 · Intelecto 1 · Vontade 3',
      'elfos-do-mar':'Força 1 · Destreza 3 · Intelecto 3 · Vontade 2',doppelganger:'Força 1 · Destreza 4 · Intelecto 3 · Vontade 1',espectro:'Força 1 · Destreza 2 · Intelecto 3 · Vontade 3',kitsune:'Força 1 · Destreza 3 · Intelecto 3 · Vontade 2',
      ilusionista:'Força 1 · Destreza 2 · Intelecto 4 · Vontade 2',trapaceiro:'Força 2 · Destreza 4 · Intelecto 2 · Vontade 1',psionicos:'Força 1 · Destreza 2 · Intelecto 3 · Vontade 4',antipaladino:'Força 4 · Destreza 1 · Intelecto 1 · Vontade 4',arcanista:'Força 1 · Destreza 2 · Intelecto 4 · Vontade 2',
      'clerigo-de-guerra':'Força 3 · Destreza 2 · Intelecto 1 · Vontade 4','clerigo-negro':'Força 1 · Destreza 2 · Intelecto 3 · Vontade 4'
    };
    const historiaExtra={
      animagos:'Ao atingir a maturidade, cada Animago participa de uma vigília solitária para ouvir o nome da sua fera-guia. O nome escolhido vira um compromisso: usar o instinto para proteger, e não para dominar.',
      homunculo:'Alguns carregam o nome que receberam do criador; outros adotam nomes após sua primeira escolha livre. Há comunidades de Homúnculos que mantêm oficinas coletivas para reparar corpos e preservar memórias.',
      golens:'Entre eles, marcas e rachaduras são tratados como memórias, não defeitos. Um Golem experiente costuma gravar no próprio corpo os nomes daqueles que jurou proteger.',
      wendigo:'Suas aldeias celebram a primeira nevasca com banquetes e histórias ao redor de pedras aquecidas. Quem viaja para longe leva um fragmento do fogo comunitário como lembrança de casa.',
      'elfos-do-mar':'Para esse povo, mapas são cantados antes de serem desenhados, pois correntes mudam e lembranças permanecem. Seus jovens aprendem a ouvir baleias e a respeitar territórios de criaturas antigas.',
      doppelganger:'Em seus círculos, revelar o rosto original é um gesto de confiança extrema. Eles mantêm arquivos de máscaras e diários para não se perderem nas identidades que assumem.',
      espectro:'A âncora de um Espectro pode ser uma pessoa, um objeto ou um lugar. Quando a promessa se encerra, muitos escolhem partir em paz; outros encontram uma nova razão para permanecer.',
      kitsune:'As histórias Kitsune são sempre contadas com duas versões: uma para crianças e outra para quem já aprendeu a desconfiar das aparências. Eles valorizam promessas feitas sob luz de lanterna.',
      ilusionista:'As academias de ilusão ensinam que a ética começa antes do primeiro encanto: um bom Ilusionista conhece a diferença entre maravilhar alguém e retirar sua escolha.',
      trapaceiro:'Guildas de Trapaceiros raramente usam o mesmo nome por duas gerações. Seus códigos são feitos de gestos, apelidos e dívidas de favor, muito mais difíceis de decifrar que um cadeado.',
      psionicos:'O treinamento Psiónico começa com silêncio e disciplina, não com poder. Mestres insistem que uma mente sem propósito pode se tornar mais perigosa que qualquer espada.',
      antipaladino:'O juramento do Algoz é registrado em uma lâmina, corrente ou cicatriz. Rompê-lo não traz uma punição automática, mas obriga o juramentado a encarar quem se tornou.',
      arcanista:'Cada Arcanista mantém um caderno de erros, pois descobertas perigosas geralmente nascem de fórmulas incompletas. Bibliotecas arcanas trocam conhecimento por promessas de uso responsável.',
      'clerigo-de-guerra':'Antes de uma campanha, esses clérigos abençoam suprimentos, rotas de retirada e os nomes de quem não voltou. Para eles, vencer também significa garantir que alguém possa retornar para casa.',
      'clerigo-negro':'Seus santuários ficam perto de criptas, ruínas e fronteiras espirituais. Seus rituais lembram aos vivos que a morte merece respeito, e aos mortos que o descanso também é uma forma de justiça.'
    };
    const id=new URLSearchParams(location.search).get('id'),f=fichas[id],root=document.getElementById('conteudo');
    if(!f){root.innerHTML='<p class="erro"><a class="voltar" href="racaeclasses.html">← Voltar para Raças e Classes</a></p><h1>Ficha não encontrada</h1>';}
    else{document.title=f.nome+' — Nexalis';root.innerHTML=`<a class="voltar" href="racaeclasses.html">← Voltar para Raças e Classes</a><header><p class="sub">${f.tipo}</p><h1>✦ ${f.nome}</h1><p>${f.sub}</p></header><div class="layout"><section><article class="secao"><h2>⌁ História</h2><p>${f.historia} ${historiaExtra[id]}</p></article><article class="secao"><h2>⌁ Ficha de origem</h2><p>${f.ficha.join('<br>')}</p></article><article class="secao"><h2>⌁ Cultura e identidade</h2><p>A origem de ${f.nome} influencia costumes, relações e a maneira como seu personagem enxerga Nexalis. Estes traços são narrativos e podem ser adaptados à história da campanha.</p></article></section><aside class="painel"><article class="cartao"><h2>✦ Pontos iniciais</h2><p class="moeda">9 pontos distribuídos</p><p class="atributos">${pontos[id]}</p></article><article class="cartao"><h2>✦ Moeda cultural</h2><p class="moeda">${f.moeda}</p><p>Usada em trocas, rituais ou como sinal de prestígio.</p></article><article class="cartao"><h2>✦ Passivas</h2><ul>${f.passivas.map(x=>'<li>'+x+'</li>').join('')}</ul></article></aside></div>`;}
  </script>
</body>
</html>
